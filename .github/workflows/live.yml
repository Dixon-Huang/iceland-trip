name: 更新路况、天气、极光

on:
  schedule:
    - cron: "17 * * * *"   # 每小时一次（UTC，即冰岛时间）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-live.mjs
      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "更新实时数据 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
